<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 46 Practice Quiz 3</title>

    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Default Feedback Colors (Fallback for custom themes) */
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }

        [data-theme="dark"] {
            --bg-body: #1e293b; --bg-card: #334155; --bg-header: #0f172a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-accent: #38bdf8;
            --border-color: #475569; --highlight-bg: #475569;
            --button-bg: #38bdf8; --button-text: #0f172a; --button-hover: #0ea5e9;
        }

        [data-theme="light"] {
            --bg-body: #f3f4f6; --bg-card: #ffffff; --bg-header: #ffffff;
            --text-main: #1f2937; --text-muted: #6b7280; --text-accent: #2563eb;
            --border-color: #e5e7eb; --highlight-bg: #f3f4f6;
            --button-bg: #2563eb; --button-text: #ffffff; --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5; --feedback-success-border: #34d399; --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2; --feedback-error-border: #f87171; --feedback-error-text: #991b1b;
        }

        [data-theme="midnight"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #e0e0e0; --text-muted: #888888; --text-accent: #90caf9;
            --border-color: #333333; --highlight-bg: #1a1a1a;
            --button-bg: #90caf9; --button-text: #000000; --button-hover: #42a5f5;
            --feedback-success-bg: #051b11; --feedback-success-border: #0f5132; --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e; --feedback-error-border: #842029; --feedback-error-text: #ea868f;
        }

        [data-theme="legacy-dark"] {
            --bg-body: #2d343e; --bg-card: #3c424f; --bg-header: #3c424f;
            --text-main: #e8e6e3; --text-muted: #b0c4de; --text-accent: #8ab4f8;
            --border-color: #555; --highlight-bg: #454c5a;
            --button-bg: #8ab4f8; --button-text: #202124; --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41; --feedback-success-border: #52b788; --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129; --feedback-error-border: #a4133c; --feedback-error-text: #f8d7da;
        }

        [data-theme="sepia"] {
            --bg-body: #f4ecd8; --bg-card: #fdf6e3; --bg-header: #e4d5b7;
            --text-main: #433422; --text-muted: #7c6f5a; --text-accent: #a05a2c;
            --border-color: #d3c4a5; --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c; --button-text: #fdf6e3; --button-hover: #864822;
            --feedback-success-bg: #e6f4ea; --feedback-success-border: #8ab893; --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3; --feedback-error-border: #d48f8f; --feedback-error-text: #5c2b2b;
        }

        [data-theme="contrast"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #ffffff; --text-muted: #dddddd; --text-accent: #ffff00;
            --border-color: #ffffff; --highlight-bg: #333333;
            --button-bg: #ffff00; --button-text: #000000; --button-hover: #e6e600;
            --feedback-success-bg: #000000; --feedback-success-border: #00ff00; --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000; --feedback-error-border: #ff0000; --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        header.unpinned { position: relative; box-shadow: none; }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; flex-wrap: wrap; gap: 15px;
        }

        header h1 { font-size: 1.5rem; margin: 0; color: var(--text-accent); font-weight: 700; }

        .controls-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* --- Custom Theme Builder --- */
        .custom-builder {
            display: none; flex-wrap: wrap; gap: 15px;
            background-color: var(--bg-card); padding: 10px 15px;
            border-radius: 8px; border: 1px solid var(--border-color);
            margin-top: 5px; font-size: 0.85rem; animation: fadeIn 0.3s;
            width: 100%; justify-content: flex-end;
        }
        .custom-builder.active { display: flex; }
        .color-picker-group { display: flex; align-items: center; gap: 8px; }
        .color-picker-group input[type="color"] {
            border: none; width: 25px; height: 25px; border-radius: 4px;
            cursor: pointer; padding: 0; background: none;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Controls --- */
        .header-btn {
            background-color: var(--highlight-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        .pin-btn {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            cursor: pointer; padding: 0 10px; border-radius: 6px; font-size: 1rem;
            transition: background-color 0.2s; height: 34px; display: flex;
            align-items: center; justify-content: center;
        }
        .pin-btn:hover { background-color: var(--highlight-bg); }
        .pin-btn.pin-active { background-color: rgba(0, 0, 0, 0.1); }

        select#theme-select {
            padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-card); color: var(--text-main);
            cursor: pointer; font-family: inherit; height: 34px;
        }

        /* --- Section Navigation --- */
        .section-nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .section-nav button {
            background-color: var(--highlight-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            font-weight: 500; transition: all 0.2s;
        }
        .section-nav button:hover { border-color: var(--text-accent); color: var(--text-accent); }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
            scroll-margin-top: 150px; /* Offset for sticky header */
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            display: none; /* Hidden by default */
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        .btn-link {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-link:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: flex-start; }
            .section-nav { justify-content: flex-start; }
            .custom-builder { justify-content: flex-start; }
            header h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <h1>Week 46 Practice Quiz 3</h1>
            <div class="controls-wrapper">
                
                <!-- Reveal LOs Button -->
                <button id="reveal-all-btn" class="header-btn" onclick="toggleAllLOs()">Show Learning Objectives</button>
                
                <!-- Pin Button -->
                <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">📌</button>
                
                <!-- Theme Selector -->
                <div class="theme-control">
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="dark">Modern Dark</option>
                        <option value="midnight">Midnight</option>
                        <option value="light">Modern Light</option>
                        <option value="legacy-dark">Legacy Dark</option>
                        <option value="sepia">Sepia</option>
                        <option value="contrast">High Contrast</option>
                        <option value="custom">⚙️ Custom...</option>
                    </select>
                </div>
            </div>
            
            <!-- Custom Theme Color Pickers -->
            <div class="custom-builder" id="custom-builder">
                <div class="color-picker-group">
                    <label>Background:</label>
                    <input type="color" id="color-bg" value="#1a1a2e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Cards:</label>
                    <input type="color" id="color-card" value="#16213e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Text:</label>
                    <input type="color" id="color-text" value="#e94560" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Accent:</label>
                    <input type="color" id="color-accent" value="#0f3460" oninput="updateCustomTheme()">
                </div>
            </div>
        </div>
        
        <!-- Dynamic Navigation Bar -->
        <div class="section-nav" id="section-nav"></div>
    </header>

    <div class="container">
        <div id="quiz-root">
            <!-- Content injected via JS -->
        </div>
    </div>

    <script>
        // --- Data ---
        const quizData = [
            // --- Section 1: Parathyroid Pathology ---
            {
                section: "Parathyroid Pathology",
                fullLO: "LO1: Compare and contrast hyperparathyroidism and hypoparathyroidism regarding etiology, clinical manifestations, morphologic features, and biochemical features.",
                question: "A 55-year-old woman presents to her primary care physician with complaints of generalized fatigue, weakness, and mild depression over the past several months. She also reports a recent episode of severe flank pain that was diagnosed as a kidney stone (nephrolithiasis). Laboratory testing reveals an elevated serum calcium level. Which of the following is the most likely diagnosis?",
                options: {
                    A: "Adrenal insufficiency",
                    B: "Congenital adrenal hyperplasia",
                    C: "Hyperparathyroidism",
                    D: "Hypoparathyroidism",
                    E: "Medullary thyroid carcinoma"
                },
                correctAnswer: "C",
                rationale: "The patient’s clinical presentation of fatigue, weakness, mild depression, nephrolithiasis, and elevated serum calcium is classic for hyperparathyroidism. Modern presentations often feature these vague symptoms, whereas classic signs also included osteitis fibrosa cystica and peptic ulcers.",
                source: "Parathyroid Pathology PDF, slides 7 & 8: 'Hyperparathyroidism Typical Modern Signs & Symptoms • Vague symptoms • Fatigue & weakness • Mild depression' and 'Classic Signs & Symptoms • Nephrolithiasis'"
            },
            {
                section: "Parathyroid Pathology",
                fullLO: "LO1: Compare and contrast hyperparathyroidism and hypoparathyroidism regarding etiology, clinical manifestations, morphologic features, and biochemical features.",
                question: "A 58-year-old woman is evaluated for osteoporosis and recurrent peptic ulcers. Her physician suspects primary hyperparathyroidism. If this diagnosis is correct, laboratory evaluation is most likely to reveal an elevated serum intact parathyroid hormone (PTH) level alongside which of the following serum chemistry profiles?",
                options: {
                    A: "Decreased calcium and decreased phosphate",
                    B: "Decreased calcium and increased phosphate",
                    C: "Increased calcium and decreased phosphate",
                    D: "Increased calcium and increased phosphate",
                    E: "Normal calcium and normal phosphate"
                },
                correctAnswer: "C",
                rationale: "Primary hyperparathyroidism (1° Hyper-PTH) biochemically shows an elevated PTH level, an elevated calcium (Ca++) level, and a decreased phosphate (PO4-) level. Hypoparathyroidism, conversely, shows low Ca++ and high PO4-.",
                source: "Parathyroid Pathology PDF, slide 15: '1° Hyper-PTH | PTH [Up arrow] | Ca++ [Up arrow] | PO4- [Down arrow]'"
            },
            {
                section: "Parathyroid Pathology",
                fullLO: "LO1: Compare and contrast hyperparathyroidism and hypoparathyroidism regarding etiology, clinical manifestations, morphologic features, and biochemical features.",
                question: "A 42-year-old man undergoes a total thyroidectomy for a large multinodular goiter. Two days after surgery, he develops tingling around his lips and spasms in his hands (increased neuromuscular excitability). Laboratory tests show a decreased serum calcium level and an elevated serum phosphate level. The patient's current condition is most likely caused by which of the following?",
                options: {
                    A: "Autoimmune destruction of the adrenal cortex",
                    B: "Inadvertent surgical excision of the parathyroid glands",
                    C: "Paraneoplastic syndrome",
                    D: "Pituitary adenoma",
                    E: "Renal failure"
                },
                correctAnswer: "B",
                rationale: "The patient is presenting with hypoparathyroidism, indicated by increased neuromuscular excitability, low serum calcium, and high serum phosphate following neck surgery. Surgical excision is a primary etiology of hypoparathyroidism.",
                source: "Parathyroid Pathology PDF, slide 18: 'Hypoparathyroidism Causes • Surgical excision... Biochemical PTH [Down arrow] Ca++ [Down arrow] PO4- [Up arrow] Clinical features • Increased neuromuscular excitability'"
            },
            {
                section: "Parathyroid Pathology",
                fullLO: "LO2: Compare and contrast primary, secondary and tertiary hyperparathyroidism regarding etiology, clinical manifestations, morphologic features, and biochemical features.",
                question: "A 60-year-old man with chronic renal disease develops severe bone demineralization and osteoclastic bone resorption (renal osteodystrophy). His physician explains that his diseased kidneys are failing to excrete phosphate, leading to hyperphosphatemia. This hyperphosphatemia suppresses the renal hydroxylation of an inactive precursor into which of the following active molecules, thereby driving his secondary hyperparathyroidism?",
                options: {
                    A: "1,25-(OH)2D",
                    B: "25-hydroxyvitamin D",
                    C: "Calcitonin",
                    D: "Parathyroid hormone-related protein (PTH-rP)",
                    E: "RANK ligand"
                },
                correctAnswer: "A",
                rationale: "In chronic renal disease, decreased phosphate excretion leads to hyperphosphatemia. High PO4 suppresses the renal hydroxylation of inactive vitamin D to active 1,25-(OH)2D. The resulting low 1,25-(OH)2D and low calcium absorption stimulate the parathyroid glands, causing secondary hyperparathyroidism.",
                source: "Parathyroid Pathology PDF, slide 12: 'Renal Osteodystrophy | Chronic Renal Disease... ↑ PO4 suppresses renal hydroxylation of inactive vitamin D to active 1,25-(OH)2D'"
            },
            {
                section: "Parathyroid Pathology",
                fullLO: "LO2: Compare and contrast primary, secondary and tertiary hyperparathyroidism regarding etiology, clinical manifestations, morphologic features, and biochemical features.",
                question: "A 60-year-old man with a long-standing history of chronic renal insufficiency is evaluated for bone pain. Laboratory results reveal an elevated parathyroid hormone (PTH) level, a low-to-normal serum calcium level, and an elevated serum phosphate level. A biopsy of his parathyroid glands would most likely show which of the following?",
                options: {
                    A: "A single parathyroid adenoma",
                    B: "Bilateral cortical nodular disease",
                    C: "Parathyroid carcinoma",
                    D: "Parathyroid hyperplasia",
                    E: "Primary bilateral macronodular disease"
                },
                correctAnswer: "D",
                rationale: "This patient has secondary hyperparathyroidism, which is most commonly caused by chronic renal insufficiency or Vitamin D deficiency. It presents with elevated PTH, low/normal calcium, and elevated phosphate. The most common underlying parathyroid pathology in secondary hyperparathyroidism is parathyroid hyperplasia.",
                source: "Parathyroid Pathology PDF, slides 10 & 11: 'Secondary • Parathyroid hyperplasia • Chronic renal insufficiency • Vitamin D deficiency... Most Common Pathology of 2° Hyperparathyroidism [Image showing Hyperplasia]'"
            },
            {
                section: "Parathyroid Pathology",
                fullLO: "LO2: Compare and contrast primary, secondary and tertiary hyperparathyroidism regarding etiology, clinical manifestations, morphologic features, and biochemical features.",
                question: "A 55-year-old woman with a history of chronic renal disease and secondary hyperparathyroidism presents with new-onset, persistent hypercalcemia. Her physician explains that her hyperplastic parathyroid glands have now acquired autonomous function. According to modern pathology definitions, this condition is now regarded as a neoplastic transformation. Which of the following is the most accurate diagnosis for her current state?",
                options: {
                    A: "Primary hyperparathyroidism",
                    B: "Pseudohypoparathyroidism",
                    C: "Quaternary hyperparathyroidism",
                    D: "Secondary hyperparathyroidism",
                    E: "Tertiary hyperparathyroidism"
                },
                correctAnswer: "E",
                rationale: "Tertiary hyperparathyroidism develops in some cases of secondary hyperparathyroidism (typically associated with chronic renal disease) when the hyperplastic glands acquire autonomous function, resulting in persistent hyperparathyroidism and hypercalcemia. It is now regarded as a neoplastic transformation of secondary hyperplasia.",
                source: "Parathyroid Pathology PDF, slide 14: 'Tertiary Hyperparathyroidism • May develop in some cases of 2° hyper-PTH • Typically associated with chronic renal disease • Hyperplastic glands acquire autonomous function • Now regarded as transformation from 2° hyperplasia to neoplasia • Results in persistent hyperparathyroidism and hypercalcemia'"
            },
            {
                section: "Parathyroid Pathology",
                fullLO: "LO3: Differentiate parathyroid hyperplasia from parathyroid adenoma and carcinoma.",
                question: "A 45-year-old woman with end-stage renal disease undergoes surgery for severe, refractory secondary hyperparathyroidism. The surgeon evaluates all four parathyroid glands and notes that they are all symmetrically enlarged. Under the 2022 WHO classification, the diagnosis of parathyroid hyperplasia is formally defined by which of the following criteria?",
                options: {
                    A: "An absolute increase in parenchymal cells in multiple glands",
                    B: "An isolated proliferation of chief cells in a single gland",
                    C: "Extensive capsular and vascular invasion by parenchymal cells",
                    D: "The presence of frequent atypical mitotic figures",
                    E: "The replacement of glandular parenchyma with stromal adipose tissue"
                },
                correctAnswer: "A",
                rationale: "Parathyroid hyperplasia is defined as an absolute increase in parathyroid parenchymal cells in multiple glands. Secondary hyperplasia (often due to renal disease) is now regarded as the only true form of parathyroid hyperplasia. Adenomas typically involve a single gland, while invasion defines carcinoma.",
                source: "Parathyroid Pathology PDF, slide 22: 'Parathyroid Hyperplasia • Definition: an absolute increase in parathyroid parenchymal cells in multiple glands'"
            },
            {
                section: "Parathyroid Pathology",
                fullLO: "LO3: Differentiate parathyroid hyperplasia from parathyroid adenoma and carcinoma.",
                question: "A 50-year-old woman undergoes excision of an enlarged parathyroid gland for primary hyperparathyroidism. Histological examination of the 1.5-gram encapsulated mass reveals a hypercellular proliferation of chief cells without appreciable stromal adipose tissue. Additionally, a distinct rim of compressed, non-neoplastic parathyroid tissue is visible at the edge of the mass. Which of the following is the most likely diagnosis?",
                options: {
                    A: "Atypical parathyroid tumor",
                    B: "Lipoadenoma",
                    C: "Parathyroid adenoma",
                    D: "Parathyroid carcinoma",
                    E: "Parathyroid hyperplasia"
                },
                correctAnswer: "C",
                rationale: "A parathyroid adenoma is a benign neoplasm characterized histologically by hypercellularity with no appreciable stromal adipose tissue, and it often features a rim of non-neoplastic parathyroid tissue. The other glands are typically normal or atrophic.",
                source: "Parathyroid Pathology PDF, slide 26: 'Parathyroid Adenoma • Hypercellular with no appreciable stromal adipose tissue • May find rim of non-neoplastic parathyroid tissue'"
            },
            {
                section: "Parathyroid Pathology",
                fullLO: "LO3: Differentiate parathyroid hyperplasia from parathyroid adenoma and carcinoma.",
                question: "A 65-year-old man presents with severe primary hyperparathyroidism. A parathyroid mass is excised, and the pathologist notes frequent mitotic activity, fibrous bands, and pleomorphism. To definitively diagnose this mass as a parathyroid carcinoma rather than an adenoma, the pathologist must identify which of the following features?",
                options: {
                    A: "DNA aneuploidy",
                    B: "High cell density",
                    C: "Invasion into adjacent soft tissues or vascular structures",
                    D: "Lack of stromal adipose tissue",
                    E: "Presence of oncocytes"
                },
                correctAnswer: "C",
                rationale: "In parathyroid tumors, mitotic activity, pleomorphism, and fibrous bands are suggestive but not definitive for malignancy. The definitive features required to diagnose a parathyroid carcinoma are invasion (into adjacent soft tissues, thyroid, vascular, or perineural invasion) and/or metastasis.",
                source: "Parathyroid Pathology PDF, slide 31: 'Parathyroid Carcinoma Definitive Features • Invasion • Into adjacent soft tissues or thyroid • Vascular • Perineural • Metastasis'"
            },
            {
                section: "Parathyroid Pathology",

                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.innerHTML = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            const returnContainer = document.createElement('div');
            returnContainer.style.textAlign = 'center';
            returnContainer.style.marginTop = '2rem';
            
            const returnBtn = document.createElement('a');
            returnBtn.href = 'https://ibecerramcg.github.io/GI-GU-ENDO-Practice-Quizzes/';
            returnBtn.className = 'btn-link';
            returnBtn.textContent = '← Return to Quiz Directory';
            
            returnContainer.appendChild(returnBtn);
            quizRoot.appendChild(returnContainer);

            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            themeSelect.value = savedTheme;
            changeTheme(savedTheme);

            const savedPinState = localStorage.getItem('headerPinned');
            toggleHeader(savedPinState !== 'false');
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            localStorage.setItem('quizTheme', themeName);
            
            if (themeName === 'custom') {
                rootElements.removeAttribute('data-theme');
                customBuilder.classList.add('active');
                loadCustomTheme();
            } else {
                rootElements.setAttribute('data-theme', themeName);
                customBuilder.classList.remove('active');
                rootElements.removeAttribute('style');
            }
        }

        function updateCustomTheme() {
            const bg = document.getElementById('color-bg').value;
            const card = document.getElementById('color-card').value;
            const text = document.getElementById('color-text').value;
            const accent = document.getElementById('color-accent').value;

            rootElements.style.setProperty('--bg-body', bg);
            rootElements.style.setProperty('--bg-header', bg);
            rootElements.style.setProperty('--bg-card', card);
            rootElements.style.setProperty('--highlight-bg', card);
            rootElements.style.setProperty('--text-main', text);
            rootElements.style.setProperty('--text-accent', accent);
            rootElements.style.setProperty('--button-bg', accent);
            rootElements.style.setProperty('--button-text', bg);
            rootElements.style.setProperty('--border-color', accent + '40');

            const customColors = { bg, card, text, accent };
            localStorage.setItem('customThemeColors', JSON.stringify(customColors));
        }

        function loadCustomTheme() {
            const savedColors = JSON.parse(localStorage.getItem('customThemeColors'));
            if (savedColors) {
                document.getElementById('color-bg').value = savedColors.bg;
                document.getElementById('color-card').value = savedColors.card;
                document.getElementById('color-text').value = savedColors.text;
                document.getElementById('color-accent').value = savedColors.accent;
                updateCustomTheme();
            } else {
                updateCustomTheme();
            }
        }

        function toggleHeader(forceState) {
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
</body>
</html>
